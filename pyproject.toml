[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-vectors"
version = "0.1.0"
description = "Reproducible extraction and computational verification of emotion vectors in open-weight language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.25",
    "datasets>=2.18",
    "matplotlib>=3.8",
    "numpy==1.26.4",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "safetensors>=0.4",
    "scikit-learn>=1.5,<1.6",
    "scipy>=1.13,<1.14",
    "torch>=2.5",
    "tqdm>=4.65",
    "transformers>=4.46,<5",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.35,<2"]
cuda = ["triton>=3.1; platform_system == 'Linux'"]
umap = ["umap-learn>=0.5.6,<0.5.8"]
dev = [
    "black>=24.10",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Dependencies for the pre-existing emergent-misalignment research package retained
# under em_organism_dir/. They are intentionally opt-in so the emotion-vector pipeline
# has a small, reproducible default environment.
legacy = [
    "backoff>=2.2.1",
    "bitsandbytes>=0.45.4",
    "cmasher>=1.9.2",
    "fire>=0.7.0",
    "gradio>=5.31.0",
    "peft>=0.7.0",
    "plotly>=6.0.1",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.4",
    "tabulate>=0.9.0",
    "vllm>=0.8.2",
    "wandb>=0.15.0",
]

[project.scripts]
emotion-vectors-generate = "emotion_vectors.cli:generate_main"
emotion-vectors-extract = "emotion_vectors.cli:extract_main"
emotion-vectors-build = "emotion_vectors.cli:build_main"
emotion-vectors-verify = "emotion_vectors.cli:verify_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["emotion_vectors*"]

[tool.setuptools.package-data]
emotion_vectors = ["assets/*.yaml", "assets/*.txt", "assets/*.py"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"tests/*.py" = ["S101"]
