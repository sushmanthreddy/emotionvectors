[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotionvectors"
version = "0.2.0"
description = "Reproducible layer-wise emotion-vector pipelines for Qwen2.5"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate==1.14.0",
  "numpy==1.26.4",
  "Pillow==11.1.0",
  "torch==2.5.1",
  "transformers==4.46.3",
]

[project.scripts]
emotionvectors-generate-stories = "emotionvectors.generation.emotional_stories:main"
emotionvectors-generate-neutral = "emotionvectors.generation.neutral_dialogues:main"
emotionvectors-extract = "emotionvectors.extraction.raw_vectors:main"
emotionvectors-story-extract = "emotionvectors.extraction.story_raw_vectors:main"
emotionvectors-neutral-pca = "emotionvectors.extraction.neutral_pca:main"
emotionvectors-clean = "emotionvectors.extraction.clean_vectors:main"
emotionvectors-clean-vectors = "emotionvectors.extraction.clean_vectors:main"
emotionvectors-score = "emotionvectors.visualization.score_tokens:main"
emotionvectors-plot = "emotionvectors.visualization.anthropic_style:main"
emotionvectors-score-subset = "emotionvectors.visualization.subset_score:main"
emotionvectors-plot-subset = "emotionvectors.visualization.subset_plot:main"

[tool.setuptools.packages.find]
where = ["src"]
